<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dossier Médical - Symptômes Fonctionnels</title>
</head>

<body>
  <div class="app-wrapper default">
    <app-menu></app-menu>
    <div class="app-content">
      <app-header></app-header>

      <div class="container-fluid">
        <app-tabs></app-tabs>
        <main>
          <div class="container">
            <h2>Depuis la derniere visite avez vous?</h2>

            <form [formGroup]="updateForm" (ngSubmit)="updateFunctionalSymptoms()">
              <div class="form-group">
                <label><strong>Sélectionnez les signes fonctionnels :</strong></label><br>

                <div class="symptom-grid">
                  <div *ngFor="let symptom of symptomList">
                    <label>
                      <input type="checkbox" [formControlName]="symptom" (change)="onCheckboxChange(symptom)">
                      {{ symptomLabels[symptom] }}
                    </label>
                  </div>
                </div>

                <div *ngIf="isInvalidAndTouchedOrDirty('symptoms')" class="text-danger">
                  Veuillez sélectionner au moins un symptôme.
                </div>
              </div>
              <br>

              <div class="date-and-button">
                <div class="Date">
                  <label for="functionalSymptomsDate">Date des symptômes cliniques</label>
                  <input type="date" formControlName="functionalSymptomsDate" class="custom-date"
                    [class.is-invalid]="isInvalidAndTouchedOrDirty('functionalSymptomsDate')" required>
                </div>

                <button type="submit" class="btn btn-primary">Ajouter</button>
              </div>


            </form>
          </div>

        </main>
      </div>
    </div>
  </div>
</body>

</html>
