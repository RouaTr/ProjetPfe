
  <div class="position-relative">
    <div class="authentication-wrapper authentication-basic container-p-y p-4 p-sm-0">
      <div class="authentication-inner py-6">

        <!-- Register Card -->
        <div class="card p-md-7 p-1">
          <!-- Logo -->
          <div class="app-brand justify-content-center mt-5">
            <a class="app-brand-link gap-2">
              <span class="app-brand-logo demo">

              </span>
              <span class="app-brand-text demo text-heading fw-semibold">MediVIH</span>
            </a>
          </div>
          <!-- /Logo -->
          <div class="card-body mt-1">
            <h4 class="mb-2">Créez Votre Compte 🚀</h4>

            <form id="formAuthentication" class="mb-3" (ngSubmit)="addNewPractitionner()"
              [formGroup]="PractitionnerForm">
              <div class="form-floating form-floating-outline mb-3">
                <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username"
                  autofocus formControlName="practitionnerLastName">
                <label for="username">Nom</label>
              </div>
              <div class="form-floating form-floating-outline mb-3">
                <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username"
                  autofocus formControlName="practitionnerFirstName">
                <label for="username">Prénom</label>
              </div>
              <div class="form-floating form-floating-outline mb-3">
                <input type="text" class="form-control" id="practitionnerPhoneNumber" name="practitionnerPhoneNumber"
                  placeholder="Numéro de Téléphone" formControlName="practitionnerPhoneNumber" maxlength="8"
                  pattern="[0-9]{8}">
                <label for="practitionnerPhoneNumber">Numéro de Téléphone</label>
              </div>

              <div class="form-floating form-floating-outline mb-3">
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email"
                  formControlName="practitionnerEmail">
                <label for="email">Email</label>
              </div>
              <div class="mb-3form-password-toggle">
                <div class="input-group input-group-merge">
                  <div class="form-floating form-floating-outline">
                    <input type="password" id="password" class="form-control" name="password" formControlName="password"
                      placeholder="&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;"
                      aria-describedby="password" />
                    <label for="password">Mot de Passe</label>
                  </div>
                  <span class="input-group-text cursor-pointer"><i class="ri-eye-off-line"></i></span>
                </div>
              </div><br>
              <div class="form-floating form-floating-outline">
                <select class="form-control" id="example-select" formControlName="practitionnerRole">

                  <option>medecin</option>
                  <option>pharmacien</option>
                  <option hidden>admin</option>

                </select>

                <label for="password">Role</label>
              </div>
              <input type="hidden" name="practitionnerRole" value="medecin">

              <button class="bt" type="submit">
                Sign up
              </button>
            </form>

            <p class="text-center">
              <span>Vous Avez Déja Un Compte?</span>
              <a href="">
                <span class="login">Login</span>
              </a>
            </p>




          </div>
          <div *ngIf="messageCommande" class="alert alert-danger" style="color: rgb(18, 11, 11); font-weight: bold;">
            {{ messageCommande }}
          </div>
        </div>
        <!-- Register Card -->

      </div>
    </div>
  </div>

  <!-- / Content -->
